name: Backend PR
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Compile Python
        run: python -m compileall -q backend/app
      - name: Build backend image
        run: docker compose build backend