[project]
name = "campus-lost-property-starter"
version = "0.1.0"
description = "Campus Lost Property Desk classroom starter"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi", "psycopg[binary]", "uvicorn"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
