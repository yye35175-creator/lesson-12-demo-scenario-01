<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Lost Property Desk</title>
  <link rel="stylesheet" href="/assets/main.css">
  <script type="module" src="/scripts/index.js"></script>
</head>
<body>
  <main>
    <h1>Campus Lost Property Desk</h1>
    <section aria-labelledby="items-title">
      <h2 id="items-title">Found items</h2>
      <ul id="items"><li>Loading found items…</li></ul>
      <p id="item-detail" aria-live="polite">Select an item for details.</p>
    </section>
    <section aria-labelledby="claim-title">
      <h2 id="claim-title">Request an item</h2>
      <form id="claim-form">
        <label>Item <select name="item_id" required></select></label>
        <label>Claimant <select name="claimant_id" required></select></label>
        <label>Proof colour <input name="proof_colour" required autocomplete="off"></label>
        <button type="submit" disabled>Submit claim</button>
      </form>
      <p id="claim-result" role="status"></p>
    </section>
  </main>
</body>
</html>
